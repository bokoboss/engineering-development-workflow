name: Validate workflow repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate required workflow contracts
        run: python scripts/validate_repository.py
      - name: Test project bootstrap installer
        run: python -m unittest discover -s tests -p 'test_*.py' -v
